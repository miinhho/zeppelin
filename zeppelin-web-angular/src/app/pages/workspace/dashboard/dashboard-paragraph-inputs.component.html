@if (hasParagraphForms) {
  <section>
    <h4>Paragraph inputs</h4>
    <zeppelin-notebook-paragraph-dynamic-forms
      [formDefs]="paragraphForms"
      [paramDefs]="paragraphParams"
      [runOnChange]="false"
      [compact]="true"
      [disable]="busy"
    ></zeppelin-notebook-paragraph-dynamic-forms>
  </section>
}
@if (hasNoteForms) {
  <section>
    <h4>Notebook inputs</h4>
    <zeppelin-notebook-paragraph-dynamic-forms
      [formDefs]="localNoteForms"
      [paramDefs]="localNoteParams"
      [runOnChange]="false"
      [compact]="true"
      [disable]="busy"
    ></zeppelin-notebook-paragraph-dynamic-forms>
  </section>
}
<div class="source-actions">
  <button nz-button nzType="primary" type="button" [disabled]="busy || cancelling" (click)="run()">Run source</button>
  @if (busy && runAccepted) {
    <button nz-button type="button" [nzLoading]="cancelling" [disabled]="cancelling" (click)="cancel()">
      Cancel run
    </button>
  }
  <span class="source-status" role="status" aria-live="polite">{{ busy && !runAccepted ? 'Starting…' : status }}</span>
</div>
@if (error) {
  <p class="source-error" role="alert">{{ error }}</p>
}
@if (sourceError) {
  <details class="source-error">
    <summary>Source execution failed</summary>
    <pre>{{ sourceError }}</pre>
  </details>
}
